# uv workspace for all Python components (Python 3.12, HLD 6).
# Linux (CI, Docker, project server) uses the CPU-only PyTorch wheels,
# macOS uses the default PyPI wheels (MPS). Colab uses its preinstalled CUDA torch.

[tool.uv.workspace]
members = ["core", "ml", "service"]

[tool.uv.sources]
macrolog-core = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["macrolog_core", "macrolog_ml", "macrolog_service"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["core/tests", "ml/tests", "service/tests"]

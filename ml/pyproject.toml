[project]
name = "macrolog-ml"
version = "0.1.0"
description = "MacroLog+ ML pipeline: prepare, split, train, evaluate, calibrate, release (HLD 2.5, 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "macrolog-core",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "scipy>=1.13",
]

[project.scripts]
macrolog-ml = "macrolog_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

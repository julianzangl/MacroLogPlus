[project]
name = "macrolog-service"
version = "0.1.0"
description = "MacroLog+ inference service (FastAPI, HLD 2.3, 5.2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "macrolog-core",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
